[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delegation-ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4", "cryptography>=50,<51", "rfc8785>=0.1.4,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.55,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
