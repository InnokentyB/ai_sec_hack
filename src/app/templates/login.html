<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Delegation Ledger</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
  <main>
    <h1>Agent Delegation Ledger</h1>
    <p>Local demonstration. Enter the access key provisioned for the owner.</p>
    <form method="post" action="/login">
      <label for="token">Owner access key</label>
      <input id="token" name="token" type="password" required autocomplete="current-password">
      <button type="submit">Open ledger</button>
    </form>
    <p class="muted">Synthetic documents only. Agents follow deterministic scripts.</p>
  </main>
</body>
</html>
